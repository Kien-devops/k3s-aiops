apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-backend
  namespace: aiops
  labels:
    app: aiops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-backend
  template:
    metadata:
      labels:
        app: aiops-backend
    spec:
      serviceAccountName: aiops-backend-sa
      nodeSelector:
        kubernetes.io/hostname: server-tang4
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/kien-devops/k3s-aiops-backend:latest
          imagePullPolicy: Always


          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: ROUTER_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: router-url
            - name: ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: router-key
            - name: ROUTER_MODEL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: router-model
            - name: PROMETHEUS_URL
              value: "http://192.168.30.45:9090"
            - name: LOKI_URL
              value: "http://loki.aiops.svc.cluster.local:3100"
            - name: TEMPO_URL
              value: "http://tempo.aiops.svc.cluster.local:3200"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3


---
apiVersion: v1
kind: Service
metadata:
  name: aiops-backend-service
  namespace: aiops
  labels:
    app: aiops-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: aiops-backend
