apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops-ingress
  namespace: aiops
  labels:
    app: aiops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: aiops.onprem.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-backend-service
                port:
                  number: 80
