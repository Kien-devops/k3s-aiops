apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8s-scraper
  namespace: kube-system
  labels:
    app.kubernetes.io/name: prometheus-k8s-scraper
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-k8s-scraper-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: prometheus-k8s-scraper
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-k8s-scraper
  labels:
    app.kubernetes.io/name: prometheus-k8s-scraper
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - services
      - services/proxy
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-k8s-scraper
  labels:
    app.kubernetes.io/name: prometheus-k8s-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-k8s-scraper
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s-scraper
    namespace: kube-system

