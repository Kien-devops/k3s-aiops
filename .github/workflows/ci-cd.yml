name: CI/CD Pipeline - K3s AIOps Platform

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/k3s-aiops-backend

jobs:
  test:
    name: 🧪 Run Unit & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=backend python -m pytest backend/tests -v --durations=10

  security-scan:
    name: 🛡️ Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-and-push:
    name: 🐳 Build & Push Immutable Container Image
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k3s:
    name: 🚀 Deploy to K3s Production (Self-Hosted Runner)
    needs: build-and-push
    # Strictly deploy ONLY on push to main branch! Feature branches and PRs NEVER deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10

    steps:
      - name: Verify Image Digest
        id: verify-digest
        shell: bash
        run: |
          DIGEST="${{ needs.build-and-push.outputs.image_digest }}"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Image digest is empty! Cannot proceed with immutable deployment."
            exit 1
          fi
          echo "Target Digest: $DIGEST"
          echo "TARGET_IMAGE_URI=ghcr.io/${{ env.IMAGE_NAME }}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Deploy Immutable Image to K3s Cluster
        shell: bash
        run: |
          echo "=== Deploying Immutable Image: $TARGET_IMAGE_URI ==="
          kubectl -n aiops set image deployment/aiops-backend backend="$TARGET_IMAGE_URI"

      - name: Verify Rollout Status
        shell: bash
        run: |
          echo "Waiting for rollout to finish successfully..."
          kubectl -n aiops rollout status deployment/aiops-backend --timeout=180s

      - name: Verify Deployed Pod Image Digest
        shell: bash
        run: |
          echo "Verifying running pod image matches target digest..."
          DEPLOYED_IMG=$(kubectl -n aiops get deployment aiops-backend -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployed image in spec: $DEPLOYED_IMG"
          if [[ "$DEPLOYED_IMG" != "$TARGET_IMAGE_URI" ]]; then
            echo "::error::Digest mismatch! Expected: $TARGET_IMAGE_URI, Found: $DEPLOYED_IMG"
            exit 1
          fi
          echo "Digest verified successfully!"

      - name: Run Smoke Tests on Health Endpoints
        shell: bash
        run: |
          echo "=== Running Cluster-Internal Smoke Test ==="
          POD_IP=$(kubectl -n aiops get pods -l app=aiops-backend -o jsonpath='{.items[0].status.podIP}')
          echo "Target Pod IP: $POD_IP"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${POD_IP}:8000/api")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Smoke test failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test passed with HTTP 200 OK!"

      - name: Rollback on Failure
        if: failure()
        shell: bash
        run: |
          echo "::warning::Deployment or smoke tests failed! Initiating rollback to previous revision..."
          kubectl -n aiops rollout undo deployment/aiops-backend
          kubectl -n aiops rollout status deployment/aiops-backend --timeout=120s
          echo "Rollback completed."
