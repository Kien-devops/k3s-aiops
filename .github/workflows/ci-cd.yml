name: CI/CD Pipeline - K3s AIOps Platform

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/k3s-aiops-backend

jobs:
  build-and-push:
    name: 🐳 Build & Push Backend to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-self-hosted:
    name: 🚀 Rollout on K3s Cluster (Self-Hosted Runner)
    needs: build-and-push
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Rollout Restart Pod on K3s
        shell: bash
        run: |
          echo "=== ROLLING OUT NEW IMAGE TO K3S AIOPS BACKEND ==="
          kubectl rollout restart deployment/aiops-backend -n aiops
          echo "Waiting for rollout to finish..."
          kubectl rollout status deployment/aiops-backend -n aiops --timeout=120s
          echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          kubectl get pods -n aiops -l app=aiops-backend -o wide

  deploy-ssh-fallback:
    name: 🌐 Rollout on K3s Cluster (SSH Remote Fallback)
    needs: [build-and-push, deploy-self-hosted]
    if: needs.deploy-self-hosted.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Execute Remote Rollout via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.K3S_HOST != ''
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USER || 'node' }}
          password: ${{ secrets.K3S_PASSWORD }}
          key: ${{ secrets.K3S_SSH_KEY }}
          port: 22
          script: |
            echo "=== TRIGGERING REMOTE ROLLOUT ON K3S ==="
            sudo k3s kubectl rollout restart deployment/aiops-backend -n aiops
            sudo k3s kubectl rollout status deployment/aiops-backend -n aiops --timeout=120s
            sudo k3s kubectl get pods -n aiops -l app=aiops-backend -o wide
